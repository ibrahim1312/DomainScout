<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DomainScout — Domain evaluator</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#172033;font:16px system-ui}main{max-width:850px;margin:auto;padding:32px 18px}header{margin-bottom:28px}h1{font-size:36px;margin:0;color:#173b70}section{background:white;border:1px solid #dbe3ee;border-radius:16px;padding:24px;margin:16px 0}textarea{width:100%;min-height:110px;padding:12px;border:1px solid #94a3b8;border-radius:8px;font:inherit}button{background:#174b9c;color:white;border:0;border-radius:8px;padding:12px 20px;font:inherit;cursor:pointer;margin:12px 8px 0 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #e2e8f0;overflow-wrap:anywhere}progress{width:100%;accent-color:#174b9c}small{color:#475569}a{color:#174b9c}
</style></head><body><main><header><h1>DomainScout</h1><p>Open-source domain portfolio intelligence</p><a href="https://github.com/ibrahim1312/DomainScout">Source code · MIT license</a></header><section><h2>Evaluate your domains</h2><label for="domains">Enter one domain per line or separate with commas.</label><textarea id="domains" placeholder="example.com&#10;example.ai"></textarea><button id="evaluate">Analyze domains</button><button id="export" disabled>Export CSV</button><p><small>Local browser analysis. No data is sent to a server. Scores are lexical heuristics, not monetary appraisals.</small></p></section><section><h2>Portfolio results</h2><p id="summary" role="status">Enter domains to begin.</p><div style="overflow:auto"><table><thead><tr><th>Domain</th><th>Score / 100</th><th>Quality</th></tr></thead><tbody id="results"></tbody></table></div><p id="errors"></p></section></main><script>
const byId=id=>document.getElementById(id);let results=[];
function evaluate(raw){const domain=raw.trim().toLowerCase().replace(/\.$/,'');const labels=domain.split('.');if(domain.length>253||labels.length<2||!labels.every(x=>/^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/.test(x)))return null;const name=labels[0],n=name.length,tld=labels.at(-1);const score=(n<=6?30:n<=10?25:n<=15?18:n<=22?8:2)+({com:25,org:17,net:16,io:16,ai:16}[tld]||10)+(!name.includes('-')?15:0)+(!/\d/.test(name)?15:0)+(/^[a-z]+$/.test(name)?15:0);return {domain,score};}
byId('evaluate').onclick=()=>{const inputs=[...new Set(byId('domains').value.split(/[\s,]+/).filter(Boolean))];const invalid=[];results=[];for(const input of inputs){const r=evaluate(input);if(r)results.push(r);else invalid.push(input)}results=[...new Map(results.map(r=>[r.domain,r])).values()].sort((a,b)=>b.score-a.score);byId('results').replaceChildren();for(const r of results){const tr=document.createElement('tr');for(const v of [r.domain,String(r.score)]){const td=document.createElement('td');td.textContent=v;tr.append(td)}const td=document.createElement('td'),bar=document.createElement('progress');bar.max=100;bar.value=r.score;bar.setAttribute('aria-label',r.domain+' quality');td.append(bar);tr.append(td);byId('results').append(tr)}byId('summary').textContent=results.length+' valid domains'+(results.length?' · Average '+(results.reduce((s,r)=>s+r.score,0)/results.length).toFixed(1):'');byId('errors').textContent=invalid.length?'Invalid or unsupported names: '+invalid.join(', '):'';byId('export').disabled=!results.length};
byId('export').onclick=()=>{const blob=new Blob(['domain,quality_score\n'+results.map(r=>r.domain+','+r.score).join('\n')],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='domainscout.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></body></html>
